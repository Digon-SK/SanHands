[SanHands]
; Activa o desactiva completamente el mod.
Enabled=1

; Aplicar al jugador y/o a los NPC.
Player=1
NPCs=1

; Cada ped visible usa dos CHandObject. Mantener este valor moderado evita
; agotar el pool de objetos del juego. El jugador siempre tiene prioridad.
MaxPeds=56
MaxDistance=110.0

; Velocidad de transición entre mano relajada y puño (0.01..1.0).
GripTransitionSpeed=0.12

; Velocidad del blend de entrada/salida del gesto FUCKU (0.01..1.0).
; 0.08 equivale aproximadamente a 0.4 segundos a 30 FPS.
FuckUTransitionSpeed=0.08

; Sigue la muñeca física final de Inertia3D durante ragdoll y recuperación.
Inertia3DCompatibility=1
